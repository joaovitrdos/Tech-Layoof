spring.config.import=optional:file:.env[.properties]
spring.application.name=layoof

# ---------- Datasource (compose.yaml) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
# Segredo usado pelo TokenService (HS256). Valor vem do .env (LAYOOF_JWT_SECRET).
api.security.token.secret=${LAYOOF_JWT_SECRET}

# ---------- E-mail (SMTP) ----------
# O bean JavaMailSender so e criado quando spring.mail.host existe, por isso o default abaixo.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente usado pelo EmailSenderService (cai em spring.mail.username quando vazio).
layoof.mail.from=${MAIL_FROM}
# Em false o servico apenas loga, sem tentar conectar no SMTP (util em dev).
layoof.mail.enabled=${MAIL_ENABLED}

# ---------- Google OAuth ----------
# Client ID do tipo "Aplicativo Web" criado no Google Cloud Console.
layoof.google.client-id=${GOOGLE_CLIENT_ID}

# ---------- IA (LangChain4j + Google Gemini) ----------
# Estas duas propriedades sao a condicao do bean GoogleAiGeminiChatModel do starter
# (@ConditionalOnProperty em api-key + model-name): sem as duas o @AiService sobe sem modelo.
# A chave vem do .env, que e gitignored.
langchain4j.google-ai-gemini.chat-model.api-key=${GOOGLE_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=${GEMINI_MODEL:gemini-2.5-flash}
# Zero porque extracao de dado quer repetibilidade, nao criatividade.
langchain4j.google-ai-gemini.chat-model.temperature=0
langchain4j.google-ai-gemini.chat-model.max-output-tokens=8192
langchain4j.google-ai-gemini.chat-model.timeout=120s
langchain4j.google-ai-gemini.chat-model.max-retries=2
# Log de request/response do LangChain4j. Vaza o conteudo do artigo, use so em dev.
langchain4j.google-ai-gemini.chat-model.log-requests-and-responses=false

# ---------- Coleta ----------
layoof.ai.http-timeout-seconds=15
layoof.ai.max-caracteres-artigo=6000
layoof.ai.max-artigos-por-busca=25
# Teto de rodadas de ferramenta por ciclo. O padrao do LangChain4j e 100, o que significa ate
# 100 chamadas de modelo com a conversa crescendo. maxRegistros limita o que e gravado; este
# limita o que e gasto.
layoof.ai.max-chamadas-de-ferramenta=40
# Usada quando nem o feed nem a pagina do artigo entregam imagem. Vazio desliga o fallback.
layoof.ai.imagem-padrao=

# O fluxo normal: de 8 em 8 horas. Em dev, INGESTION_ENABLED=false no .env desliga.
layoof.ai.ingestion.enabled=${INGESTION_ENABLED:true}
layoof.ai.ingestion.cron=${INGESTION_CRON:0 0 */8 * * *}
layoof.ai.ingestion.dias=2
layoof.ai.ingestion.max-registros=15

# ---------- Chave da integracao (POST /ai/ingestion/run) ----------
# Header X-API-Key. Valor real so no .env, que e gitignored.
layoof.api.key-secret=${LAYOOF_API_KEY_SECRET}
