spring.config.import=optional:file:.env[.properties]
spring.application.name=layoof

# ---------- Datasource (compose.yaml) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
# Segredo usado pelo TokenService (HS256). Valor vem do .env (LAYOOF_JWT_SECRET).
api.security.token.secret=${LAYOOF_JWT_SECRET}

# ---------- E-mail (SMTP) ----------
# O bean JavaMailSender so e criado quando spring.mail.host existe, por isso o default abaixo.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente usado pelo EmailSenderService (cai em spring.mail.username quando vazio).
layoof.mail.from=${MAIL_FROM}
# Em false o servico apenas loga, sem tentar conectar no SMTP (util em dev).
layoof.mail.enabled=${MAIL_ENABLED}

# ---------- Google OAuth ----------
# Client ID do tipo "Aplicativo Web" criado no Google Cloud Console.
layoof.google.client-id=${GOOGLE_CLIENT_ID}
