spring.config.import=optional:file:.env[.properties]
spring.application.name=layoof

# Data Base
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
api.security.token.secret=${LAYOOF_JWT_SECRET}

# E-mail (SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
layoof.mail.from=${MAIL_FROM}
layoof.mail.enabled=${MAIL_ENABLED}

# Google OAuth
layoof.google.client-id=${GOOGLE_CLIENT_ID}

# IA (Spring AI + OpenAI)
layoof.ai.enabled=${AI_ENABLED:true}
spring.ai.model.chat=${AI_CHAT_MODEL:openai}
spring.ai.openai.api-key=${AI_CHAT_GPT_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.temperature=0.2

# COLETA AGENDADA
layoof.ai.ingestion.enabled=${INGESTION_ENABLED:true}
layoof.ai.ingestion.cron=${INGESTION_CRON:0 0 8,16 * * *}
layoof.ai.ingestion.zone=${INGESTION_ZONE:America/Sao_Paulo}
layoof.ai.ingestion.quantity=${INGESTION_QUANTITY:4}
layoof.ai.ingestion.lookback=2d
layoof.ai.ingestion.timeout=15s
layoof.ai.ingestion.terms[0]=tech layoffs
layoof.ai.ingestion.terms[1]=demissoes tecnologia

# SEGURANCA
layoof.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
layoof.security.docs-enabled=${DOCS_ENABLED:false}
layoof.security.max-payload-size=256KB

layoof.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
layoof.security.rate-limit.trust-proxy=${TRUST_PROXY:false}
layoof.security.rate-limit.auth.requests=10
layoof.security.rate-limit.auth.window=1m
layoof.security.rate-limit.standard.requests=120
layoof.security.rate-limit.standard.window=1m

# DOCUMENTACAO
springdoc.api-docs.enabled=${DOCS_ENABLED}
springdoc.swagger-ui.enabled=${DOCS_ENABLED}

# RESPOSTAS DE ERRO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# CORPO DA REQUISICAO
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# SERVIDOR
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-response-header-size=16KB
server.max-http-request-header-size=16KB
