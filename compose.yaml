services:
  postgres:
    image: 'postgres:16'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techlayoof}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB:-techlayoof}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-techlayoof}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      STORAGE_PUBLIC_URL: http://localhost:8081/files
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/layoofs/count || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: ./web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  uploads:
